<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Banner dos Jogos da escola</title>
  <desc id="desc">Estádio esportivo estilizado em tons escuros com um troféu dourado e elementos de competição.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090f14"/><stop offset=".55" stop-color="#17201f"/><stop offset="1" stop-color="#282319"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e8b94b" stop-opacity=".27"/><stop offset="1" stop-color="#e8b94b" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a8"/><stop offset=".25" stop-color="#e9bd4e"/><stop offset=".55" stop-color="#a9761d"/><stop offset=".78" stop-color="#f5d36b"/><stop offset="1" stop-color="#8c5e19"/></linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7d978"/><stop offset="1" stop-color="#7f561b"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d5a83f" stop-opacity="0"/><stop offset="1" stop-color="#d5a83f" stop-opacity=".17"/></linearGradient>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1.4" fill="#fff" opacity=".12"/><circle cx="48" cy="61" r="1" fill="#fff" opacity=".08"/><path d="M0 89 90 0" stroke="#fff" stroke-opacity=".025"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="24"/><feOffset dy="20"/><feComponentTransfer><feFuncA type="linear" slope=".4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/>
  <ellipse cx="1330" cy="490" rx="660" ry="550" fill="url(#glow)"/>
  <g opacity=".42" fill="none" stroke="#c99b3a">
    <path d="M-100 770Q900 110 1900 770" stroke-width="3" opacity=".35"/>
    <path d="M-100 830Q900 170 1900 830" stroke-width="2" opacity=".27"/>
    <path d="M-100 900Q900 240 1900 900" stroke-width="2" opacity=".2"/>
    <path d="M-100 970Q900 310 1900 970" stroke-width="2" opacity=".15"/>
  </g>
  <g opacity=".32" fill="#f5cf68" filter="url(#blur)">
    <circle cx="1400" cy="150" r="42"/><circle cx="1620" cy="265" r="32"/><circle cx="1050" cy="240" r="22"/><circle cx="1200" cy="110" r="20"/>
  </g>
  <g stroke="#f6d77c" stroke-width="9" stroke-linecap="round" opacity=".7">
    <path d="M1030 155 1004 105M1090 125 1084 66M1150 106 1163 48M1530 110 1547 52M1590 140 1621 89M1650 190 1690 151"/>
  </g>
  <path d="M0 850Q500 650 900 845T1800 820V1100H0Z" fill="url(#field)"/>
  <g fill="none" stroke="#d5b65e" opacity=".24">
    <path d="M0 1015Q900 720 1800 1015" stroke-width="3"/>
    <path d="M0 1055Q900 760 1800 1055" stroke-width="2"/>
    <ellipse cx="1320" cy="910" rx="210" ry="65" stroke-width="3"/>
  </g>
  <g transform="translate(1180 160)" filter="url(#shadow)">
    <!-- Alças -->
    <path d="M140 220C20 110-45 180 5 335c30 92 112 116 203 80l-24-72c-50 22-93 8-111-38-21-54-4-79 43-45z" fill="none" stroke="url(#gold)" stroke-width="35" stroke-linejoin="round"/>
    <path d="M490 220c120-110 185-40 135 115-30 92-112 116-203 80l24-72c50 22 93 8 111-38 21-54 4-79-43-45z" fill="none" stroke="url(#gold)" stroke-width="35" stroke-linejoin="round"/>
    <!-- Taça -->
    <path d="M120 80Q315 30 510 80l-34 305c-13 124-69 191-161 191s-148-67-161-191z" fill="url(#gold)" stroke="#f7df8d" stroke-width="8"/>
    <path d="M160 112Q315 80 470 112l-27 250c-10 91-51 141-128 141s-118-50-128-141z" fill="none" stroke="#fff0ae" stroke-opacity=".45" stroke-width="9"/>
    <path d="M225 190q90 95 180 0" fill="none" stroke="#fff3bd" stroke-opacity=".5" stroke-width="12"/>
    <path d="M270 580h90l28 130H242z" fill="url(#goldDark)"/>
    <path d="M215 700h200v75H215z" fill="url(#gold)"/>
    <path d="M170 770h290v80H170z" fill="url(#goldDark)" stroke="#edcf79" stroke-width="6"/>
    <path d="M135 850h360v85H135z" fill="#181815" stroke="#d8ac45" stroke-width="8"/>
    <path d="M105 935h420v50H105z" fill="url(#gold)"/>
    <path d="M220 730h190M190 880h270" stroke="#fff0a8" stroke-opacity=".45" stroke-width="5"/>
    <path d="M315 168l18 45 48 3-37 31 12 46-41-26-40 26 12-46-37-31 48-3z" fill="#fff0ad" opacity=".78"/>
  </g>
  <!-- Ramos de vitória em traço, equilibrando a composição sem depender de texto -->
  <g fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" opacity=".75">
    <path d="M1125 870C1000 745 1015 560 1100 430"/>
    <path d="M1122 795q-90-12-117-85M1090 700q-85-5-116-74M1079 608q-65-12-83-66M1085 520q-48-20-52-64"/>
    <path d="M1680 870c125-125 110-310 25-440"/>
    <path d="M1683 795q90-12 117-85M1715 700q85-5 116-74M1726 608q65-12 83-66M1720 520q48-20 52-64"/>
  </g>
  <rect width="1800" height="1100" fill="url(#grain)"/>
  <path d="M0 0h1800v1100H0z" fill="none" stroke="#e8bd58" stroke-opacity=".18" stroke-width="3"/>
</svg>
